[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposicion"
version = "0.1.0"
description = "Motor de reposición de inventario: pronóstico por cuantiles y pedido sugerido."
requires-python = ">=3.11"
# Las dependencias se gestionan en requirements.txt (pip + venv).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: pruebas end-to-end más lentas",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dags", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
