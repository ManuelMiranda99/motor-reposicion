# Parámetros del pronóstico y del backtest — ver src/reposicion/parametros.py
horizonte_dias: 14
dia_corte: 0                       # 0 = lunes
cuantiles_reporte: [0.1, 0.5, 0.9]
ventana_origenes_semanas: 52       # orígenes semanales de entrenamiento antes del corte
semilla: 2017
backtest:
  n_origenes: 8                    # últimos 8 lunes cuyos 14 días ya se conocen
  paso_dias: 7
ventana_features_dias: 364         # cuánta historia usan las features (para cortes_afectados)
dias_sin_operacion: ["01-01", "12-25"]  # mes-día sin demanda normal: las features los ignoran
regla_ceros: {dias_sin_ventas: 56} # serie sin ventas en 56 días → pronóstico 0
objetivo_transformado: log1p       # el modelo se entrena en log1p(y) y se predice con expm1
lightgbm:                          # un Booster por cuantil (objective=quantile, alpha=q)
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 100
  feature_fraction: 0.8
  lambda_l2: 1.0
  num_boost_round: 400
  num_threads: 4                   # fijo: el determinismo depende de él
  deterministic: true
  force_row_wise: true
  seed: 2017
  verbose: -1
# Variante "cuantil de la demanda semanal" (suma de la cobertura como objetivo); solo se compara.
lightgbm_semanal:
  num_leaves: 31
  min_data_in_leaf: 50
  num_boost_round: 300
