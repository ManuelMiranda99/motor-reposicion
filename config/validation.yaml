# Umbrales de validación y del modo degradado — ver src/reposicion/validacion.py
modo_degradado:
  max_dias_sin_ventas: 3          # en el corte T: si la última venta disponible < T-1-3 → fallar
  ventana_huecos_dias: 28         # fechas faltantes de ventas en los últimos 28 días → advertencia
  dias_sin_operacion: ["12-25"]   # mes-día sin ventas por diseño (no son huecos)
# completitud_min_ventas: 0.8     # descomentar para mandar a cuarentena ventas con < 80% de filas
